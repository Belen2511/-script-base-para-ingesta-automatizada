[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-ia-ingestion"
version = "0.1.0"
description = "Motor de ingesta asíncrona (asyncio + httpx) con logging y reintentos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
