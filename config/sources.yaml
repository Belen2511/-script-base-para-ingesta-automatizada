# Fuentes de la ingesta: cada ubicación se consulta en paralelo contra
# https://api.open-meteo.com/v1/forecast
#
# Variables horarias disponibles: https://open-meteo.com/en/docs
hourly_variables:
  - temperature_2m        # °C
  - relative_humidity_2m  # %
  - precipitation         # mm
  - wind_speed_10m        # km/h

past_days: 1       # horas observadas del día anterior
forecast_days: 1   # pronóstico del día actual

